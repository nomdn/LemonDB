name: Build

on:
  workflow_dispatch:
  schedule:
    # 每日 01:30 UTC（北京 09:30）：APNIC dump 日更后自动重建
    - cron: 30 1 * * *

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Download APNIC dump
        run: |
          mkdir -p data && cd data
          base=https://ftp.apnic.net/apnic/whois
          for f in inetnum inet6num aut-num route route6; do
            curl -fsSL -o $f.gz "$base/apnic.db.$f.gz"
            gunzip -kf $f.gz
          done

      - name: Build mmdb
        run: |
          go run . \
            -inetnum data/inetnum -inet6num data/inet6num -autnum data/aut-num \
            -route4 data/route -route6 data/route6 \
            -out-location CN-LOCATION.mmdb -out-asn CN-ASN.mmdb

      - name: Release
        run: |
          TAG=$(date +%Y.%m.%d)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CN-LOCATION.mmdb CN-ASN.mmdb --clobber
          else
            gh release create "$TAG" CN-LOCATION.mmdb CN-ASN.mmdb --title "CN IP DB $TAG" --notes "WHOIS 底线库日更"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
